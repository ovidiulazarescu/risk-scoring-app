name: Deploy to AWS (ECS + CloudFront)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch: # enables the manual "Run workflow" button

permissions:
  contents: read
  id-token: write # required for AWS OIDC federation

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: risk-scoring-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the OIDC token's claims so the IAM trust policy can be matched against them
      - name: Debug OIDC claims
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="$payload==" ;;
            3) payload="$payload=" ;;
          esac
          echo "$payload" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deployer-risk-scoring-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./backend
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform apply
        id: terraform
        working-directory: infra/aws
        run: |
          terraform init \
            -backend-config="bucket=tf-state-${{ vars.AWS_ACCOUNT_ID }}"
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.terraform.outputs.bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.terraform.outputs.distribution_id }}" \
            --paths "/*"
